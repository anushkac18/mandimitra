services:
  - type: web
    name: mandimitra-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /tmp/mandimitra.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://mandimitra-delta.vercel.app
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_GATE_PASSWORD
        sync: false
      - key: DEMO_WEIGHBRIDGE_PASSWORD
        sync: false
      - key: DEMO_FARMER_PASSWORD
        sync: false
